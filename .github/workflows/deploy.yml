name: Deploy

on:
  push:
    tags:
      - v**-release

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: xterium-wallet:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image
        run: docker save xterium-wallet:latest | gzip > xterium-wallet.tar.gz

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: mkdir -p ${{ secrets.DEPLOY_PATH }}

      - name: Upload image and compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: xterium-wallet.tar.gz,docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Load image and restart container
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            gunzip -c xterium-wallet.tar.gz | docker load
            docker compose up -d --remove-orphans
            rm -f xterium-wallet.tar.gz
            docker image prune -f
